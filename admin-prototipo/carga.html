<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<title>Herraidea Admin</title>
<link rel="preload" as="image" href="../assets/brand/logo-intro.png">
<link rel="stylesheet" href="fuentes/fuentes.css">
<style>
  :root{--tinta:#0b0d10;--rojo:#fa1418;--rojo-marca:#f10001}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--tinta);color:#fff;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- pantalla de carga ---------- */
  .carga{position:fixed;inset:0;z-index:10;overflow:hidden;touch-action:none}
  .carga-fondo{position:absolute;inset:0;display:grid;place-items:center;
    background:radial-gradient(110vmax 80vmax at 85% 115%,rgba(250,20,24,.20),transparent 60%),var(--tinta)}
  /* retícula de plano: aparece y se desliza muy despacio */
  .reticula{position:absolute;inset:-56px;opacity:0;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);
    animation:reticulaEntra 1.2s .05s ease-out forwards,reticulaDeriva 14s linear infinite}
  /* marcas de esquina, como en un plano */
  .esquina{position:absolute;width:26px;height:26px;border-color:rgba(255,255,255,.28);border-style:solid;border-width:0;opacity:0;animation:esquinaEntra .7s cubic-bezier(.16,1,.3,1) forwards}
  .e1{top:max(22px,env(safe-area-inset-top));left:22px;border-top-width:1.5px;border-left-width:1.5px;transform-origin:0 0;animation-delay:.1s}
  .e2{top:max(22px,env(safe-area-inset-top));right:22px;border-top-width:1.5px;border-right-width:1.5px;transform-origin:100% 0;animation-delay:.18s}
  .e3{bottom:max(22px,env(safe-area-inset-bottom));right:22px;border-bottom-width:1.5px;border-right-width:1.5px;transform-origin:100% 100%;animation-delay:.26s}
  .e4{bottom:max(22px,env(safe-area-inset-bottom));left:22px;border-bottom-width:1.5px;border-left-width:1.5px;transform-origin:0 100%;animation-delay:.34s}
  .coordenada{position:absolute;top:max(30px,calc(env(safe-area-inset-top) + 8px));left:58px;font:600 10px/1 'Archivo Narrow',sans-serif;letter-spacing:.28em;color:rgba(255,255,255,.32);text-transform:uppercase;opacity:0;animation:aparece .6s .55s forwards}
  .coordenada.derecha{left:auto;right:58px}

  .centro{position:relative;display:grid;justify-items:center;gap:clamp(18px,3vh,26px);width:min(520px,76vw)}
  /* logotipo: misma coreografía que la portada pública */
  .logo{position:relative;width:100%;aspect-ratio:1400/195}
  .logo img{position:absolute;inset:0;display:block;width:100%;height:100%}
  .chev{clip-path:inset(0 87.43% 0 0);animation:chevron .7s .2s cubic-bezier(.16,1,.3,1) both}
  .palabra{clip-path:inset(0 0 0 12.57%);animation:palabra .75s .5s cubic-bezier(.65,0,.35,1) both}
  .punto{position:absolute;left:61%;top:.9%;width:3.05%;height:21%;background:var(--rojo-marca);transform-origin:50% 100%;animation:punto .6s 1.15s both}
  /* línea roja que se abre desde el centro */
  .linea{display:block;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--rojo) 18%,var(--rojo) 82%,transparent);transform:scaleX(0);animation:linea .65s 1.5s cubic-bezier(.65,0,.35,1) forwards}
  /* ADMIN, letra por letra desde su máscara */
  .admin{display:flex;gap:0;margin:0;font:700 clamp(20px,3.6vw,30px)/1 'Archivo Narrow',sans-serif;letter-spacing:.62em;margin-right:-.62em;text-transform:uppercase}
  .admin span{display:inline-block;overflow:hidden;padding-bottom:.08em}
  .admin span i{display:inline-block;font-style:normal;transform:translateY(110%);animation:letra .55s cubic-bezier(.16,1,.3,1) forwards}
  .subtitulo{margin:0;font:600 11px/1 'Archivo Narrow',sans-serif;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:rgba(255,255,255,.5);opacity:0;animation:aparece .7s 2.15s forwards}

  .estado{position:absolute;left:50%;bottom:max(92px,calc(env(safe-area-inset-bottom) + 82px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    font:600 10px/1 'Archivo Narrow',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.42);white-space:nowrap;opacity:0;animation:aparece .6s 2.3s forwards}
  .estado i{width:6px;height:6px;border-radius:50%;background:var(--rojo);animation:pulso 1.2s ease-in-out infinite}

  /* crédito de ProcesaLab: igual que la pantalla de carga de www.herraidea.com */
  .credito{position:absolute;left:50%;bottom:max(30px,calc(env(safe-area-inset-bottom) + 20px));width:max-content;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
    color:rgba(255,255,255,.6);text-decoration:none;font:600 11px/1 'Archivo Narrow','Arial Narrow',Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;
    transition:color .2s;animation:creditoEntra .7s .5s ease-out both}
  .credito:hover{color:#fff}
  .pl{display:flex;align-items:center;gap:.46em;font-size:15px;opacity:.92}
  .pl img{display:block;flex:none;width:auto;max-width:none;height:1em}
  .pl .engrane{height:1.43em;animation:engrane 9s linear infinite}
  @keyframes creditoEntra{from{opacity:0;transform:translate(-50%,8px)}}
  @keyframes engrane{to{transform:rotate(360deg)}}
  @media(max-width:480px){.credito{flex-direction:column;gap:10px}.pl{font-size:16px}.estado{bottom:max(112px,calc(env(safe-area-inset-bottom) + 102px))}}

  /* salida: barrido rojo en chevrón (mismo gesto que la portada pública) */
  .barrido{position:absolute;left:0;top:0;height:100%;width:calc(148vw + 15.6vh);background:var(--rojo);transform:translateX(-210vw);
    clip-path:polygon(0 0,calc(100% - 15.6vh) 0,100% 50%,calc(100% - 15.6vh) 100%,0 100%,15.6vh 50%)}
  .carga.sale .barrido{animation:barrido .84s both}
  .carga.sale .carga-fondo{animation:oculta 0s .42s forwards}

  @keyframes reticulaEntra{to{opacity:1}}
  @keyframes reticulaDeriva{to{transform:translate(56px,56px)}}
  @keyframes esquinaEntra{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes aparece{to{opacity:1}}
  @keyframes chevron{from{opacity:0;transform:translateX(-19.5%)}}
  @keyframes palabra{from{clip-path:inset(0 87.43% 0 12.57%)}}
  @keyframes punto{
    0%{opacity:0;transform:translateY(-1080%);animation-timing-function:cubic-bezier(.55,0,1,.45)}
    1%{opacity:1}
    36%{transform:translateY(0) scale(1.25,.8);animation-timing-function:cubic-bezier(0,.55,.45,1)}
    55%{transform:translateY(-270%) scale(.95,1.05);animation-timing-function:cubic-bezier(.55,0,1,.45)}
    73%{transform:translateY(0) scale(1.1,.92);animation-timing-function:cubic-bezier(0,.55,.45,1)}
    82%{transform:translateY(-68%);animation-timing-function:cubic-bezier(.55,0,1,.45)}
    91%{transform:translateY(0)}95%{transform:translateY(-17%)}100%{opacity:1;transform:none}}
  @keyframes linea{to{transform:scaleX(1)}}
  @keyframes letra{to{transform:none}}
  @keyframes pulso{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  @keyframes barrido{
    0%{transform:translateX(-210vw);animation-timing-function:cubic-bezier(.25,.6,.45,1)}
    50%{transform:translateX(-40.7vw);animation-timing-function:cubic-bezier(.55,0,.75,.4)}
    100%{transform:translateX(121.4vw)}}
  @keyframes oculta{to{visibility:hidden}}

  @media(max-width:560px){.coordenada{display:none}.centro{width:min(420px,78vw)}}
  @media(prefers-reduced-motion:reduce){
    .carga *,.carga *::before{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
    .carga.sale{transition:opacity .3s;opacity:0}
  }

  /* ---------- pantalla que queda debajo (solo para la demostración) ---------- */
  .acceso{min-height:100%;display:grid;place-items:center;padding:24px;background:#f5f6f7;color:var(--tinta)}
  .tarjeta{width:min(380px,100%);background:#fff;border:1px solid #e3e6e9;padding:34px 30px 30px;box-shadow:0 24px 60px rgba(11,13,16,.08)}
  .tarjeta img{width:170px;display:block}
  .tarjeta small{display:block;margin:14px 0 26px;font:700 11px 'Archivo Narrow';letter-spacing:.3em;text-transform:uppercase;color:#fa1418}
  .tarjeta label{display:grid;gap:8px;font:600 11px 'Archivo Narrow';letter-spacing:.14em;text-transform:uppercase;color:#4b5158}
  .tarjeta input{font:400 16px Archivo;padding:13px 14px;border:1px solid #dfe3e6;background:#f5f6f7}
  .tarjeta button{margin-top:16px;width:100%;min-height:50px;border:0;background:var(--tinta);color:#fff;font:700 13px 'Archivo Narrow';letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  .tarjeta button:hover{background:#fa1418}
  .tarjeta p{margin:18px 0 0;font-size:12px;color:#8a9199;text-align:center}
  .tarjeta .repetir{background:none;color:#4b5158;min-height:0;margin-top:10px;text-decoration:underline;font:600 11px 'Archivo Narrow';letter-spacing:.12em}
</style>
</head>
<body>
  <div class="carga" id="carga" aria-hidden="true">
    <div class="carga-fondo">
      <div class="reticula"></div>
      <i class="esquina e1"></i><i class="esquina e2"></i><i class="esquina e3"></i><i class="esquina e4"></i>
      <span class="coordenada">León, Gto. · 21.12° N</span><span class="coordenada derecha">HRD · Cotizador</span>
      <div class="centro">
        <div class="logo"><img class="chev" src="../assets/brand/logo-intro.png" alt=""><img class="palabra" src="../assets/brand/logo-intro.png" alt=""><i class="punto"></i></div>
        <i class="linea"></i>
        <p class="admin" aria-label="Admin"></p>
        <p class="subtitulo">Panel de cotizaciones</p>
      </div>
      <div class="estado"><i></i><span id="estado-texto">Preparando el panel</span></div>
      <a class="credito" href="https://procesa-lab-web.vercel.app" target="_blank" rel="noopener" tabindex="-1"><span>Diseño y desarrollo:</span><span class="pl"><img src="../assets/brand/procesalab-palabra-blanco.png" alt="ProcesaLab"><img class="engrane" src="../assets/brand/procesalab-engrane-blanco.png" alt=""></span></a>
    </div>
    <div class="barrido"></div>
  </div>

  <main class="acceso">
    <form class="tarjeta" onsubmit="return false">
      <img src="../assets/logo-gray-nodot.png" alt="Herraidea">
      <small>Admin · Cotizaciones</small>
      <label>Contraseña<input type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <button type="submit">Entrar</button>
      <button type="button" class="repetir" id="repetir">Ver la animación otra vez</button>
      <p>Prototipo: el acceso todavía no está conectado.</p>
    </form>
  </main>

<script>
  // ADMIN letra por letra
  const admin = document.querySelector('.admin');
  [...'ADMIN'].forEach((l, i) => {
    const s = document.createElement('span'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = `<i style="animation-delay:${(1.62 + i * .07).toFixed(2)}s">${l}</i>`; admin.appendChild(s);
  });
  ['touchmove', 'wheel'].forEach(t => document.getElementById('carga').addEventListener(t, e => e.preventDefault(), { passive: false }));

  // En el panel real, "listo" llegará cuando se verifique la sesión y se carguen los precios.
  // En esta demostración la salida ocurre a los 3.2 s.
  const esperar = ms => new Promise(r => setTimeout(r, ms));
  async function salir() {
    const carga = document.getElementById('carga');
    document.getElementById('estado-texto').textContent = 'Listo';
    await esperar(250); carga.classList.add('sale');
    await esperar(900); carga.style.display = 'none';
  }
  const inicio = performance.now();
  const panelListo = esperar(1200);   // sustituir por la verificación real
  Promise.all([panelListo, esperar(3200)]).then(salir);
  document.getElementById('repetir').addEventListener('click', () => location.reload());
</script>
</body>
</html>
